<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spanish Coach</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 0 0 40px 0;
  }

  header {
    background: #16213e;
    padding: 16px 20px;
    text-align: center;
    border-bottom: 1px solid #0f3460;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    color: #e94560;
    letter-spacing: 0.5px;
  }

  .settings-btn {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #8a8a9a;
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
  }

  .settings-btn:hover { color: #e94560; }

  /* Settings Panel */
  .settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .settings-overlay.open { display: flex; }

  .settings-panel {
    background: #16213e;
    border-radius: 16px;
    padding: 28px 24px;
    width: 90%;
    max-width: 400px;
    border: 1px solid #0f3460;
  }

  .settings-panel h2 {
    font-size: 18px;
    margin-bottom: 20px;
    color: #e94560;
  }

  .settings-panel label {
    display: block;
    font-size: 13px;
    color: #8a8a9a;
    margin-bottom: 6px;
    margin-top: 16px;
  }

  .settings-panel label:first-of-type { margin-top: 0; }

  .settings-panel input[type="password"],
  .settings-panel select {
    width: 100%;
    padding: 12px;
    background: #1a1a2e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 15px;
  }

  .settings-save {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Main content */
  .container {
    padding: 20px 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .dialect-badge {
    text-align: center;
    margin-bottom: 16px;
  }

  .dialect-badge span {
    display: inline-block;
    background: #0f3460;
    color: #8a8a9a;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
  }

  .input-group {
    margin-bottom: 16px;
  }

  .input-group label {
    display: block;
    font-size: 13px;
    color: #8a8a9a;
    margin-bottom: 6px;
    font-weight: 500;
  }

  textarea {
    width: 100%;
    padding: 14px;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 10px;
    color: #e0e0e0;
    font-size: 16px;
    line-height: 1.5;
    resize: none;
    min-height: 60px;
    font-family: inherit;
  }

  textarea:focus {
    outline: none;
    border-color: #e94560;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity 0.2s;
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .submit-btn:active:not(:disabled) {
    opacity: 0.8;
  }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 40px 0;
    color: #8a8a9a;
  }

  .loading.show { display: block; }

  .loading .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }

  /* Results */
  .results {
    display: none;
    margin-top: 24px;
  }

  .results.show { display: block; }

  .divider {
    border: none;
    border-top: 1px solid #0f3460;
    margin: 20px 0;
  }

  .result-section {
    margin-bottom: 20px;
  }

  .result-label {
    font-size: 12px;
    color: #e94560;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .result-text {
    font-size: 16px;
    line-height: 1.6;
    color: #e0e0e0;
  }

  .result-text.spanish {
    font-size: 18px;
    font-weight: 500;
  }

  .result-text.guess-back {
    color: #c0a0a0;
    font-style: italic;
  }

  .notes-text {
    font-size: 15px;
    line-height: 1.7;
    color: #b0b0c0;
    margin-top: 8px;
  }

  .word-breakdown {
    margin-top: 4px;
  }

  .word-entry {
    padding: 10px 0;
    border-bottom: 1px solid rgba(15, 52, 96, 0.5);
  }

  .word-entry:last-child { border-bottom: none; }

  .word-spanish {
    font-weight: 600;
    color: #e94560;
    font-size: 16px;
  }

  .word-meaning {
    color: #e0e0e0;
    font-size: 15px;
    line-height: 1.6;
    margin-top: 4px;
  }

  .grammar-flag {
    background: #0f3460;
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 16px;
    border-left: 3px solid #e94560;
  }

  .grammar-flag-title {
    font-size: 13px;
    color: #e94560;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .grammar-flag-text {
    font-size: 14px;
    line-height: 1.6;
    color: #b0b0c0;
  }

  /* First-run overlay */
  .first-run {
    display: none;
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    z-index: 300;
    padding: 60px 24px 40px;
    text-align: center;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .first-run.show { display: flex; }

  .first-run h2 {
    color: #e94560;
    font-size: 24px;
    margin-bottom: 16px;
  }

  .first-run p {
    color: #8a8a9a;
    font-size: 15px;
    line-height: 1.6;
    max-width: 340px;
    margin-bottom: 24px;
  }

  .first-run input {
    width: 100%;
    max-width: 340px;
    padding: 14px;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 10px;
    color: #e0e0e0;
    font-size: 16px;
    margin-bottom: 16px;
  }

  .first-run button {
    width: 100%;
    max-width: 340px;
    padding: 16px;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Error */
  .error {
    display: none;
    background: #3a1a1a;
    border: 1px solid #e94560;
    border-radius: 10px;
    padding: 14px;
    margin-top: 16px;
    color: #e0a0a0;
    font-size: 14px;
  }

  .error.show { display: block; }
</style>
</head>
<body>

<!-- First Run Setup -->
<div class="first-run" id="firstRun">
  <h2>Spanish Coach</h2>
  <p>Paste your OpenRouter API key below to get started. It stays on your device and is never shared.</p>
  <input type="password" id="firstRunKey" placeholder="sk-or-...">
  <button onclick="saveFirstRun()">Get Started</button>
</div>

<!-- Header -->
<header>
  <h1>Spanish Coach</h1>
  <button class="settings-btn" onclick="openSettings()">&#9881;</button>
</header>

<!-- Settings Overlay -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettingsOutside(event)">
  <div class="settings-panel">
    <h2>Settings</h2>
    <label>OpenRouter API Key</label>
    <input type="password" id="settingsKey" placeholder="sk-or-...">
    <label>Dialect</label>
    <select id="settingsDialect">
      <option value="neutral">Neutral Latin American</option>
      <option value="mexican">Mexican</option>
      <option value="caribbean">Caribbean (Cuba/DR/PR)</option>
      <option value="rioplatense">Rioplatense (Argentina/Uruguay)</option>
      <option value="andean">Andean (Peru/Bolivia/Ecuador)</option>
      <option value="colombian">Colombian</option>
      <option value="central-american">Central American</option>
      <option value="castilian">Castilian (Spain)</option>
    </select>
    <button class="settings-save" onclick="saveSettings()">Save</button>
  </div>
</div>

<!-- Main Content -->
<div class="container">
  <div class="dialect-badge">
    <span id="dialectBadge">Neutral Latin American</span>
  </div>

  <div class="input-group">
    <label>What you're trying to say (English)</label>
    <textarea id="englishInput" placeholder="e.g. What time is it?" rows="2"></textarea>
  </div>

  <div class="input-group">
    <label>Your Spanish guess</label>
    <textarea id="spanishInput" placeholder="e.g. Qué tiempo es este?" rows="2"></textarea>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">Submit</button>

  <div class="error" id="errorBox"></div>

  <div class="loading" id="loading">
    <span>Analyzing your Spanish<span class="dots"></span></span>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
  // ---- State ----
  const DIALECT_LABELS = {
    'neutral': 'Neutral Latin American',
    'mexican': 'Mexican',
    'caribbean': 'Caribbean (Cuba/DR/PR)',
    'rioplatense': 'Rioplatense (Argentina/Uruguay)',
    'andean': 'Andean (Peru/Bolivia/Ecuador)',
    'colombian': 'Colombian',
    'central-american': 'Central American',
    'castilian': 'Castilian (Spain)'
  };

  // ---- Init ----
  function init() {
    const key = localStorage.getItem('sc_api_key');
    const dialect = localStorage.getItem('sc_dialect') || 'neutral';

    if (!key) {
      document.getElementById('firstRun').classList.add('show');
    }

    document.getElementById('settingsDialect').value = dialect;
    document.getElementById('dialectBadge').textContent = DIALECT_LABELS[dialect] || 'Neutral Latin American';
  }

  // ---- First Run ----
  function saveFirstRun() {
    const key = document.getElementById('firstRunKey').value.trim();
    if (!key) return;
    localStorage.setItem('sc_api_key', key);
    localStorage.setItem('sc_dialect', 'neutral');
    document.getElementById('firstRun').classList.remove('show');
  }

  // ---- Settings ----
  function openSettings() {
    const key = localStorage.getItem('sc_api_key') || '';
    const dialect = localStorage.getItem('sc_dialect') || 'neutral';
    document.getElementById('settingsKey').value = key;
    document.getElementById('settingsDialect').value = dialect;
    document.getElementById('settingsOverlay').classList.add('open');
  }

  function closeSettingsOutside(e) {
    if (e.target === document.getElementById('settingsOverlay')) {
      document.getElementById('settingsOverlay').classList.remove('open');
    }
  }

  function saveSettings() {
    const key = document.getElementById('settingsKey').value.trim();
    const dialect = document.getElementById('settingsDialect').value;
    if (key) localStorage.setItem('sc_api_key', key);
    localStorage.setItem('sc_dialect', dialect);
    document.getElementById('dialectBadge').textContent = DIALECT_LABELS[dialect];
    document.getElementById('settingsOverlay').classList.remove('open');
  }

  // ---- Build System Prompt ----
  function buildSystemPrompt() {
    const dialect = localStorage.getItem('sc_dialect') || 'neutral';
    const dialectName = DIALECT_LABELS[dialect];

    return `You are a Spanish language coach. The user is an intermediate English speaker learning Spanish. They will give you:
1. An English sentence (what they intend to say)
2. Their Spanish guess (their attempt at translating it)

Your job is to respond with a structured analysis. Use ${dialectName} Spanish as the default dialect. When a word or construction has meaningful regional variation across the Spanish-speaking world, briefly note the alternatives.

Default to tú register (informal). Note when usted would be expected (formal contexts, elders, officials, or regions like Colombia/Costa Rica where usted is the everyday default).

Respond in EXACTLY this format — use these exact section headers with ** around them:

**Your Spanish guess:** [restate their exact Spanish input]

**Correct Spanish:** [the natural, correct translation in ${dialectName} Spanish]

**What your guess actually said:** [back-translate their Spanish guess into English — show what a Spanish speaker would actually hear/understand]

**Notes on your guess:** [a short paragraph explaining the gap — what they got right, what went wrong, how a listener would have experienced it]

**Word-by-word breakdown:**
For each word in the CORRECT Spanish sentence, provide a line starting with the word in **bold**, a dash, then its English meaning and why that word was chosen over alternatives the learner might expect. Example format:
- **Qué** — "What." The standard interrogative.
- **hora** — "hour." Spanish uses this for clock time.

**Grammar flag** (include ONLY when the correct answer uses a grammatical feature the learner clearly didn't know, such as ser vs estar, subjunctive mood, irregular conjugations, conditional tense, etc.):
- Title describing the grammar concept
- Brief practical explanation with the pattern or rule, including conjugation tables if helpful

Keep your tone warm and encouraging but precise. Do not simplify — the learner wants to understand the full picture. Do not use markdown headers (#). Use ** for bold only on the section labels and on individual Spanish words in the breakdown.`;
  }

  // ---- Submit ----
  async function handleSubmit() {
    const english = document.getElementById('englishInput').value.trim();
    const spanish = document.getElementById('spanishInput').value.trim();
    const apiKey = localStorage.getItem('sc_api_key');

    if (!apiKey) {
      document.getElementById('firstRun').classList.add('show');
      return;
    }

    if (!english || !spanish) {
      showError('Please fill in both fields.');
      return;
    }

    hideError();
    document.getElementById('results').classList.remove('show');
    document.getElementById('loading').classList.add('show');
    document.getElementById('submitBtn').disabled = true;

    const userMessage = `English intent: ${english}\nMy Spanish guess: ${spanish}`;

    try {
      const reqBody = {
        model: 'google/gemma-4-31b-it:free',
        models: [
          'google/gemma-4-31b-it:free',
          'nvidia/nemotron-3-super-120b-a12b:free',
          'google/gemma-4-26b-a4b-it:free'
        ],
        messages: [
          { role: 'system', content: buildSystemPrompt() },
          { role: 'user', content: userMessage }
        ],
        temperature: 0.3
      };

      console.log('Sending request to OpenRouter...');
      console.log('API key starts with:', apiKey.substring(0, 8) + '...');
      console.log('Request body:', JSON.stringify(reqBody).substring(0, 200));

      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`,
          'HTTP-Referer': window.location.href,
          'X-Title': 'Spanish Coach'
        },
        body: JSON.stringify(reqBody)
      });

      const rawText = await response.text();
      console.log('Response status:', response.status);
      console.log('Response body:', rawText.substring(0, 500));

      if (!response.ok) {
        let errMsg = `API error (${response.status})`;
        try {
          const errData = JSON.parse(rawText);
          errMsg = errData.error?.message || errMsg;
        } catch(e) {}
        if (response.status === 401) {
          openSettings();
          throw new Error('Your API key is invalid or expired. Paste a new OpenRouter key in Settings (openrouter.ai/keys).');
        }
        if (response.status === 402) {
          throw new Error('Your OpenRouter account is out of credits. Add credits at openrouter.ai/credits.');
        }
        if (response.status === 429) {
          throw new Error('Free model limit reached for now. Wait a minute and try again (daily cap resets each day).');
        }
        throw new Error(errMsg + ' | Status: ' + response.status);
      }

      const data = JSON.parse(rawText);
      if (data.error) {
        throw new Error(data.error.message || 'Provider error');
      }
      const content = data.choices[0].message.content;
      renderResults(content);

    } catch (err) {
      showError(err.message || 'Something went wrong. Please try again.');
    } finally {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('submitBtn').disabled = false;
    }
  }

  // ---- Render Results ----
  function renderResults(content) {
    const container = document.getElementById('results');

    // Parse sections using line-start headers only (avoids matching bold words inside breakdown)
    const sections = {};
    const knownHeaders = [
      { key: 'guess', pattern: /your spanish guess/i },
      { key: 'correct', pattern: /correct spanish/i },
      { key: 'backTranslation', pattern: /what your guess/i },
      { key: 'notes', pattern: /notes on your guess/i },
      { key: 'breakdown', pattern: /word.by.word breakdown/i },
      { key: 'grammar', pattern: /grammar flag/i }
    ];

    // Find all section header positions (must be at line start)
    const headerRegex = /^[ \t]*\*\*([^*]+)\*\*:?[ \t]*/gm;
    const headerPositions = [];
    let m;
    while ((m = headerRegex.exec(content)) !== null) {
      const label = m[1].trim();
      let matchedKey = null;
      for (const h of knownHeaders) {
        if (h.pattern.test(label)) { matchedKey = h.key; break; }
      }
      if (matchedKey) {
        headerPositions.push({ key: matchedKey, label: label, start: m.index, end: m.index + m[0].length });
      }
    }

    // Extract body text between each header and the next
    for (let i = 0; i < headerPositions.length; i++) {
      const start = headerPositions[i].end;
      const end = (i + 1 < headerPositions.length) ? headerPositions[i + 1].start : content.length;
      const body = content.slice(start, end).trim();
      if (headerPositions[i].key === 'grammar') {
        sections.grammarTitle = headerPositions[i].label.replace(/grammar flag/i, '').replace(/^[\s\-—:]+/, '').replace(/[\s\-—:]+$/, '').trim();
        sections.grammar = body;
      } else {
        sections[headerPositions[i].key] = body;
      }
    }

    // Build HTML
    let html = '<hr class="divider">';

    // Your guess restated
    if (sections.guess) {
      html += `
        <div class="result-section">
          <div class="result-label">Your Spanish Guess</div>
          <div class="result-text spanish">${escapeHtml(sections.guess)}</div>
        </div>`;
    }

    // Correct Spanish
    if (sections.correct) {
      html += `
        <div class="result-section">
          <div class="result-label">Correct Spanish</div>
          <div class="result-text spanish">${escapeHtml(sections.correct)}</div>
        </div>`;
    }

    // Back translation
    if (sections.backTranslation) {
      html += `
        <div class="result-section">
          <div class="result-label">What Your Guess Actually Said</div>
          <div class="result-text guess-back">${escapeHtml(sections.backTranslation)}</div>
        </div>`;
    }

    // Notes
    if (sections.notes) {
      html += `
        <div class="result-section">
          <div class="result-label">Notes on Your Guess</div>
          <div class="notes-text">${formatInlineBold(escapeHtml(sections.notes))}</div>
        </div>`;
    }

    // Word breakdown
    if (sections.breakdown) {
      html += `
        <hr class="divider">
        <div class="result-section">
          <div class="result-label">Word-by-Word Breakdown</div>
          <div class="word-breakdown">${formatBreakdown(sections.breakdown)}</div>
        </div>`;
    }

    // Grammar flag
    if (sections.grammar) {
      const title = sections.grammarTitle || 'Grammar Note';
      html += `
        <div class="grammar-flag">
          <div class="grammar-flag-title">${escapeHtml(title)}</div>
          <div class="grammar-flag-text">${formatInlineBold(escapeHtml(sections.grammar))}</div>
        </div>`;
    }

    html += '<hr class="divider">';

    container.innerHTML = html;
    container.classList.add('show');
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---- Format Helpers ----
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatInlineBold(str) {
    return str.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }

  function formatBreakdown(text) {
    const lines = text.split('\n').filter(l => l.trim());
    let html = '';

    for (const line of lines) {
      const cleaned = line.replace(/^[\s\-•]+/, '').trim();
      if (!cleaned) continue;

      const match = cleaned.match(/^\*\*([^*]+)\*\*\s*[\-—:]+\s*(.*)/);
      if (match) {
        html += `
          <div class="word-entry">
            <div class="word-spanish">${escapeHtml(match[1])}</div>
            <div class="word-meaning">${formatInlineBold(escapeHtml(match[2]))}</div>
          </div>`;
      } else {
        html += `
          <div class="word-entry">
            <div class="word-meaning">${formatInlineBold(escapeHtml(cleaned))}</div>
          </div>`;
      }
    }

    return html;
  }

  // ---- Error Handling ----
  function showError(msg) {
    const el = document.getElementById('errorBox');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('errorBox').classList.remove('show');
  }

  // ---- Boot ----
  init();
</script>
</body>
</html>
